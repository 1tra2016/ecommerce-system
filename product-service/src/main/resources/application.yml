server:
  port: ${PRODUCT_SERVICE_PORT:8082}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:product_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
app:
  jwt:
    secret: ${JWT_SECRET:}
logging:
  level:
    org.hibernate.SQL: DEBUG
    com.example.identityuser: INFO
grpc:
  server:
    port: ${PRODUCT_GRPC_SERVER_PORT:9090}

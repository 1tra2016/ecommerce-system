syntax = "proto3";

package product;

option java_multiple_files = true;
option java_package = "com.example.product.grpc";
option java_outer_classname = "ProductServiceProto";

service ProductService {
  rpc GetVariants(GetVariantsRequest)
      returns (GetVariantsResponse);
}

message GetVariantsRequest {
  repeated int64 variant_ids = 1;
}

message GetVariantsResponse {
  repeated ProductVariantInfo variants = 1;
}

message ProductVariantInfo {
  int64 product_id = 1;
  int64 variant_id = 2;
  string sku = 3;
  string attributes = 4;
  string price = 5;
  bool active = 6;
  string product_name = 7;
}
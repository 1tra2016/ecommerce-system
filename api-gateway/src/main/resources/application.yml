
server:
  port: ${API_GATEWAY_PORT:8888}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Identity Service - Authentication
        - id: identity-auth
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        # Identity Service - User APIs
        - id: identity-user
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/user/**

        # Identity Service - Admin User APIs
        - id: identity-admin
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/admin/users/**

        # Product Service - Public APIs
        - id: product-public
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/products/**,/api/categories/**,/api/brands/**

        # Product Service - Admin APIs
        - id: product-admin
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/products/**,/api/admin/categories/**,/api/admin/brands/**

        # Order Service - Public/User APIs
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/orders/**

        # Order Service - Admin APIs
        - id: order-admin
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/admin/orders/**

        # Inventory Service - APIs
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/inventory/**

        # Inventory Service - Admin APIs
        - id: inventory-admin
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/admin/inventory/**

        # Payment Service - APIs
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/payments/**

        # Payment Service - Admin APIs
        - id: payment-admin
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/admin/payments/**

        # Notification Service - APIs
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/notifications/**

        # Notification Service - Admin APIs
        - id: notification-admin
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/admin/notifications/**

      httpclient:
        connect-timeout: 3000
        response-timeout: 5s

  codec:
    max-in-memory-size: 2MB

app:
  jwt:
    secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.example.apigateway: INFO

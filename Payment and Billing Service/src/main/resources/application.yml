server:
  port: ${PAYMENT_SERVICE_PORT:8084}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: Payment and Billing Service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration: 604800000
    refresh-token-expiration: 604800000

  messaging:
    payment-succeeded-queue: payment.succeeded.queue
    payment-review-queue: payment.review.queue

  outbox:
    publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:1000}
    confirm-timeout-ms: ${OUTBOX_CONFIRM_TIMEOUT_MS:5000}

logging:
  level:
    org.hibernate.SQL: INFO
    com.example.identityuser: INFO


payment:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    webhook-secret-file: ${STRIPE_WEBHOOK_SECRET_FILE:}
    success-url: ${PAYMENT_SUCCESS_URL:http://localhost:8888/api/payments/success}
    cancel-url: ${PAYMENT_CANCEL_URL:http://localhost:8888/api/payments/cancel}

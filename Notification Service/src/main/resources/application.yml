server:
  port: ${NOTIFICATION_SERVICE_PORT:8085}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: Notification Service

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  mail:
    from: ${MAIL_FROM:${MAIL_USER:${spring.mail.username}}}
  messaging:
    order-created-queue: ${ORDER_CREATED_QUEUE:order.created.queue}
    order-update-status-queue: ${ORDER_UPDATE_STATUS_QUEUE:order.update.status.queue}
    payment-review-queue: ${PAYMENT_REVIEW_QUEUE:payment.review.queue}
    otp-queue: ${OTP_QUEUE:notification.otp.queue}
    retry:
      max-attempts: ${NOTIFICATION_RABBITMQ_MAX_ATTEMPTS:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info
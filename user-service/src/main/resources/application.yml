server:
  port: ${IDENTITY_SERVICE_PORT:8081}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: identity-user-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:identity_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration: 604800000
    refresh-token-expiration: 604800000

logging:
  level:
    org.hibernate.SQL: DEBUG
    com.example.identityuser: INFO
